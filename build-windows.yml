name: Gerar executavel Windows
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publicar EXE
        run: dotnet publish App/DataControlRemoto.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o output
      - uses: actions/upload-artifact@v4
        with:
          name: Data-Control-Remoto-Windows
          path: output/DataControlRemoto.exe
